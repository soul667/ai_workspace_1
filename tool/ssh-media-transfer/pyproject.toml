[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-media-transfer"
version = "0.1.0"
description = "Download images/videos on an SSH host and transfer them with rsync"
requires-python = ">=3.9"
dependencies = ["questionary>=2.1.0", "rich>=13.9.0"]

[project.scripts]
media-fetch = "media_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_fetch"]
